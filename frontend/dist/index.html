<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mundo Seller</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0f172a; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { text-align: center; color: #fff; }
    h1 { font-size: 48px; margin-bottom: 20px; color: #3b82f6; }
    p { font-size: 18px; color: #94a3b8; margin-bottom: 30px; }
    .spinner { width: 50px; height: 50px; border: 4px solid rgba(59,130,246,0.1); border-top: 4px solid #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 30px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { font-size: 14px; color: #64748b; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 Mundo Seller</h1>
    <div class="spinner"></div>
    <p>Sistema de E-commerce Multi-plataforma</p>
    <p class="status">Build Compilado | Pronto para Produção</p>
  </div>
</body>
</html>
